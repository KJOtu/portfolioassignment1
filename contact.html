<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Krutarth Joshi - Contact Me</title>
    <meta name="viewport" content="width=device-width">
    <!--style sheet is for fullsize monitor-->
    <link href="full.css" rel="stylesheet" type="text/css"
    media="only screen and (min-width:960px)">
    <!--style sheet is for tablet-->
    <link href="tablet.css" rel="stylesheet" type="text/css"
    media="only screen and (min-width:481px) and (max-width:959px)">
    <!--style sheet is for smart phone-->
    <link href="smartphone.css" rel="stylesheet" type="text/css"
    media="only screen and (max-width:480px)">
</head>
<body>
    <div id="wrapper">
        <header id="banner">
            <h1>Contact Me</h1>
        </header>
        <nav>
            <h2>Links</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact Me</a></li>
            </ul>
        </nav>
        <h2>Contact Form</h2>
        <form action="mailto:krutarth.joshi1@ontariotechu.net"
        method="post" enctype="text/plain" name="form">
            <p>
                <label for="name">Name :</label>
                <input type="text" id="name" name="name" size="30"
                placeholder="Enter your name" required>
            </p>
            <p>
                <label for="email">Email :</label>
                <input type="email" id="email" name="email" size="30"
                placeholder="Enter your email address" required>
            </p>
            <!--pattern makes the cell number follow the format 123-456-7890 (from MDN Web Docs)-->
            <p>
                <label for="cell">Cell No. :</label>
                <input type="tel" id="cell" name="cell" size="30"
                placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
            </p>
            <p>
                <label for="comments">Comments :</label>
                <br>
                <textarea id="comments" name="comments" cols="30" rows="6" required></textarea>
            </p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
        <footer id="footer">
            <address>
                <p>Contact me at <a href="mailto:krutarth.joshi1@ontariotechu.net">krutarth.joshi1@ontariotechu.net</a></p>
            </address>
            <p>&copy; 2026 Krutarth Joshi</p>
        </footer>
    </div>
</body>
</html>
